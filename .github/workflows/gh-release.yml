name: CI

on:
   push:
      branches:
         - main
      tags:
         - '!**' # Don't run twice on commits with tags
   pull_request:
   workflow_dispatch:
   schedule:
      # Daily at 04:17 UTC — rebuilds and redeploys so the sponsor assets stay
      # fresh. Off the top of the hour to avoid GitHub's cron congestion.
      - cron: '17 4 * * *'

permissions:
   contents: read

env:
   GITHUB_ORG: versatiles-org

jobs:
   build:
      name: Lint, Test, Build
      runs-on: ubuntu-latest
      steps:
         - name: Checkout
           uses: actions/checkout@v7

         - name: Set up Node
           uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: npm

         - name: Install dependencies
           run: npm ci

         # Biome replaces `deno lint` + `deno fmt --check`; `ci` runs both
         # without writing to the working tree.
         - name: Lint and format
           run: npm run lint

         # Node runs the TypeScript sources via type stripping, which never
         # type-checks — so tsc has to be its own step.
         - name: Typecheck
           run: npm run typecheck

         - name: Test
           run: npm test

         # Sponsor assets are generated fresh on every deploy and are never
         # committed (see .gitignore). Main-only so fork PRs never touch secrets.
         # Deliberately NOT continue-on-error: because the assets aren't committed,
         # deploying without them would ship a 404'd sponsors image. Failing the
         # job instead leaves the last good deploy — sponsors intact — live.
         #
         # SponsorKit is a normal devDependency now, so the version is pinned by
         # package.json + package-lock.json and updated by Dependabot. It once
         # moved silently from 17 to 18, whose new duplicate-render-name check
         # failed the deploy; check sponsor.config.ts against the release notes
         # when accepting a major bump.
         - name: Generate sponsor assets
           if: github.ref == 'refs/heads/main'
           env:
              SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_GITHUB_TOKEN }}
              SPONSORKIT_OPENCOLLECTIVE_KEY: ${{ secrets.SPONSORKIT_OPENCOLLECTIVE_KEY }}
           run: npx sponsorkit

         - name: Build
           run: npm run build

         - name: Upload Pages artifact
           if: github.ref == 'refs/heads/main'
           uses: actions/upload-pages-artifact@v5
           with:
              path: 'dist'

   gh-release:
      name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'

      needs: build

      permissions:
         pages: write
         id-token: write

      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}

      runs-on: ubuntu-latest
      steps:
         - name: Deploy to GitHub Pages
           id: deployment
           uses: actions/deploy-pages@v5

   update-tools-sites:
      needs: gh-release
      # Only on real changes — the daily sponsor refresh shouldn't rebuild siblings.
      if: github.event_name != 'schedule'
      runs-on: ubuntu-latest
      steps:
         - name: Trigger tools site update
           env:
              GH_TOKEN: ${{ secrets.PAT_TOKEN }}
           run: gh workflow run ci.yml --repo ${{ env.GITHUB_ORG }}/tools --ref main

   update-playground-sites:
      needs: gh-release
      # Only on real changes — the daily sponsor refresh shouldn't rebuild siblings.
      if: github.event_name != 'schedule'
      runs-on: ubuntu-latest
      steps:
         - name: Trigger playground site update
           env:
              GH_TOKEN: ${{ secrets.PAT_TOKEN }}
           run: gh workflow run gh-release.yml --repo ${{ env.GITHUB_ORG }}/playground --ref main
