name: CI

on:
   push:
      branches:
         - main
      tags:
         - '!**' # Don't run twice on commits with tags
   pull_request:
   workflow_dispatch:
   schedule:
      # Daily at 04:17 UTC — rebuilds and redeploys so the sponsor assets stay
      # fresh. Off the top of the hour to avoid GitHub's cron congestion.
      - cron: '17 4 * * *'

permissions:
   contents: read

env:
   GITHUB_ORG: versatiles-org

jobs:
   build:
      name: Lint, Test, Build
      runs-on: ubuntu-latest
      steps:
         - name: Checkout
           uses: actions/checkout@v7

         - name: Set up Deno
           uses: denoland/setup-deno@v2
           with:
              deno-version: v2.x
              cache: true

         - name: Lint
           run: deno lint

         - name: Format
           run: deno fmt --check

         - name: Test
           run: deno test -A

         # Sponsor assets are generated fresh on every deploy and are never
         # committed (see .gitignore). Main-only so fork PRs never touch secrets.
         # Runs after `deno fmt --check` so the generated Markdown isn't linted.
         # Deliberately NOT continue-on-error: because the assets aren't committed,
         # deploying without them would ship a 404'd sponsors image. Failing the
         # job instead leaves the last good deploy — sponsors intact — live.
         - name: Set up Node (sponsor assets)
           if: github.ref == 'refs/heads/main'
           uses: actions/setup-node@v7
           with:
              node-version: 24

         - name: Generate sponsor assets
           if: github.ref == 'refs/heads/main'
           env:
              SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_GITHUB_TOKEN }}
              SPONSORKIT_OPENCOLLECTIVE_KEY: ${{ secrets.SPONSORKIT_OPENCOLLECTIVE_KEY }}
           # Pinned to a major version. Unpinned, this silently moved from 17 to
           # 18, whose new duplicate-render-name check failed the deploy. Bump
           # deliberately after checking sponsor.config.ts against the release.
           run: |
              npm init -y >/dev/null 2>&1
              npm install sponsorkit@^18.0.0
              npx sponsorkit

         # Deno auto-discovers a root package.json and resolves its dependencies,
         # where its minimum-dependency-age policy rejects a SponsorKit release
         # younger than 24h — even though nothing in src/ imports it. The npm
         # artifacts have done their job by now, so remove them before Deno runs.
         - name: Remove npm artifacts
           if: github.ref == 'refs/heads/main'
           run: rm -rf node_modules package.json package-lock.json

         - name: Build
           run: deno task build

         - name: Upload Pages artifact
           if: github.ref == 'refs/heads/main'
           uses: actions/upload-pages-artifact@v5
           with:
              path: 'dist'

   gh-release:
      name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'

      needs: build

      permissions:
         pages: write
         id-token: write

      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}

      runs-on: ubuntu-latest
      steps:
         - name: Deploy to GitHub Pages
           id: deployment
           uses: actions/deploy-pages@v5

   update-tools-sites:
      needs: gh-release
      # Only on real changes — the daily sponsor refresh shouldn't rebuild siblings.
      if: github.event_name != 'schedule'
      runs-on: ubuntu-latest
      steps:
         - name: Trigger tools site update
           env:
              GH_TOKEN: ${{ secrets.PAT_TOKEN }}
           run: gh workflow run ci.yml --repo ${{ env.GITHUB_ORG }}/tools --ref main

   update-playground-sites:
      needs: gh-release
      # Only on real changes — the daily sponsor refresh shouldn't rebuild siblings.
      if: github.event_name != 'schedule'
      runs-on: ubuntu-latest
      steps:
         - name: Trigger playground site update
           env:
              GH_TOKEN: ${{ secrets.PAT_TOKEN }}
           run: gh workflow run gh-release.yml --repo ${{ env.GITHUB_ORG }}/playground --ref main
